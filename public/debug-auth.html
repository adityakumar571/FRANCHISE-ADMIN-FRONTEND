<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Authentication</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 30px;
            font-size: 32px;
        }
        .section {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .section h2 {
            color: #38bdf8;
            font-size: 20px;
            margin-bottom: 15px;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
        }
        .item {
            margin: 12px 0;
            padding: 12px;
            background: #0f172a;
            border-radius: 6px;
        }
        .label {
            color: #94a3b8;
            font-weight: 600;
            display: inline-block;
            width: 200px;
        }
        .value {
            color: #e2e8f0;
            font-family: 'Courier New', monospace;
        }
        .success { color: #22c55e; }
        .error { color: #ef4444; }
        .warning { color: #f59e0b; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin: 5px;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
        button:active { transform: scale(0.98); }
        pre {
            background: #0f172a;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 12px;
            color: #22c55e;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            margin-left: 10px;
        }
        .status-ok { background: #22c55e; color: white; }
        .status-fail { background: #ef4444; color: white; }
        .status-warn { background: #f59e0b; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Authentication Debugger</h1>
        
        <div id="results"></div>
        
        <div class="section">
            <h2>Actions</h2>
            <button onclick="runDiagnostic()">🔄 Re-run Diagnostic</button>
            <button onclick="clearAll()">🗑️ Clear All Data</button>
            <button onclick="window.location.href='/franchise-login'">🔐 Go to Login</button>
            <button onclick="window.location.href='/franchise/dashboard'">🏠 Go to Dashboard</button>
        </div>
    </div>

    <script>
        function getCookie(name) {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [key, value] = cookie.trim().split('=');
                if (key === name) return value;
            }
            return null;
        }

        function runDiagnostic() {
            const results = document.getElementById('results');
            let html = '';

            // Check 1: Current URL
            html += `
                <div class="section">
                    <h2>1. Current Location</h2>
                    <div class="item">
                        <span class="label">Full URL:</span>
                        <span class="value">${window.location.href}</span>
                    </div>
                    <div class="item">
                        <span class="label">Hostname:</span>
                        <span class="value">${window.location.hostname}</span>
                    </div>
                    <div class="item">
                        <span class="label">Port:</span>
                        <span class="value">${window.location.port}</span>
                    </div>
                    <div class="item">
                        <span class="label">Pathname:</span>
                        <span class="value">${window.location.pathname}</span>
                    </div>
                </div>
            `;

            // Check 2: Cookies
            const lmsCookie = getCookie('LMS');
            const allCookies = document.cookie;
            
            html += `
                <div class="section">
                    <h2>2. Cookies</h2>
                    <div class="item">
                        <span class="label">LMS Cookie:</span>
                        <span class="value ${lmsCookie ? 'success' : 'error'}">
                            ${lmsCookie ? '✅ EXISTS' : '❌ MISSING'}
                        </span>
                        ${lmsCookie ? '<span class="status-badge status-ok">VALID</span>' : '<span class="status-badge status-fail">INVALID</span>'}
                    </div>
                    ${lmsCookie ? `
                        <div class="item">
                            <span class="label">Cookie Value:</span>
                            <span class="value">${lmsCookie.substring(0, 50)}...</span>
                        </div>
                    ` : ''}
                    <div class="item">
                        <span class="label">All Cookies:</span>
                        <pre>${allCookies || 'No cookies found'}</pre>
                    </div>
                </div>
            `;

            // Check 3: LocalStorage
            const user = localStorage.getItem('franchise_user');
            const franchiseInfo = localStorage.getItem('franchise_context');
            
            let userData = null;
            let userAccess = null;
            
            try {
                userData = user ? JSON.parse(user) : null;
                if (userData) {
                    const accessKey = `franchise_menu_access_${userData._id || 'default'}`;
                    userAccess = JSON.parse(localStorage.getItem(accessKey) || '{}');
                }
            } catch (e) {
                console.error('Parse error:', e);
            }

            html += `
                <div class="section">
                    <h2>3. LocalStorage Data</h2>
                    <div class="item">
                        <span class="label">User Data:</span>
                        <span class="value ${userData ? 'success' : 'error'}">
                            ${userData ? '✅ EXISTS' : '❌ MISSING'}
                        </span>
                        ${userData ? '<span class="status-badge status-ok">VALID</span>' : '<span class="status-badge status-fail">INVALID</span>'}
                    </div>
                    ${userData ? `
                        <div class="item">
                            <span class="label">Name:</span>
                            <span class="value">${userData.name || 'N/A'}</span>
                        </div>
                        <div class="item">
                            <span class="label">Email:</span>
                            <span class="value">${userData.email || 'N/A'}</span>
                        </div>
                        <div class="item">
                            <span class="label">Role:</span>
                            <span class="value">${userData.role || 'N/A'}</span>
                        </div>
                        <div class="item">
                            <span class="label">User ID:</span>
                            <span class="value">${userData._id || 'N/A'}</span>
                        </div>
                    ` : ''}
                    <div class="item">
                        <span class="label">Franchise Context:</span>
                        <span class="value ${franchiseInfo ? 'success' : 'warning'}">
                            ${franchiseInfo ? '✅ EXISTS' : '⚠️ MISSING'}
                        </span>
                    </div>
                </div>
            `;

            // Check 4: Permissions
            if (userAccess) {
                const liveRatesPerms = {
                    'liverates': userAccess.liverates,
                    'liverates_compare': userAccess.liverates_compare,
                    'liverates_dashboard': userAccess.liverates_dashboard,
                };

                html += `
                    <div class="section">
                        <h2>4. Live Rates Permissions</h2>
                        ${Object.entries(liveRatesPerms).map(([key, value]) => `
                            <div class="item">
                                <span class="label">${key}:</span>
                                <span class="value ${value ? 'success' : 'error'}">
                                    ${value ? '✅ ENABLED' : '❌ DISABLED'}
                                </span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // Check 5: Diagnosis
            let diagnosis = [];
            let canAccess = true;

            if (!lmsCookie) {
                diagnosis.push({
                    type: 'error',
                    title: 'LMS Cookie Missing',
                    desc: 'The authentication cookie is not present. You need to login.',
                    fix: 'Click "Go to Login" button and login again.'
                });
                canAccess = false;
            }

            if (!userData) {
                diagnosis.push({
                    type: 'error',
                    title: 'User Data Missing',
                    desc: 'No user information found in localStorage.',
                    fix: 'Clear all data and login again.'
                });
                canAccess = false;
            }

            if (userData && userAccess && !userAccess.liverates_compare && !['Admin', 'SuperAdmin', 'Franchise Owner'].includes(userData.role)) {
                diagnosis.push({
                    type: 'warning',
                    title: 'Permission Missing',
                    desc: 'Your user role does not have "liverates_compare" permission.',
                    fix: 'Use fix-permissions.html page to add permissions.'
                });
                canAccess = false;
            }

            if (lmsCookie && userData && (userData.role === 'Admin' || userData.role === 'SuperAdmin' || userData.role === 'Franchise Owner')) {
                diagnosis.push({
                    type: 'success',
                    title: 'Full Access Granted',
                    desc: `You are logged in as ${userData.role} - you have access to all features.`,
                    fix: 'No action needed.'
                });
                canAccess = true;
            }

            if (diagnosis.length === 0 && canAccess) {
                diagnosis.push({
                    type: 'success',
                    title: 'All Checks Passed',
                    desc: 'Authentication and permissions are valid.',
                    fix: 'You should be able to access Live Rates.'
                });
            }

            html += `
                <div class="section">
                    <h2>5. Diagnosis & Recommendations</h2>
                    ${diagnosis.map(d => `
                        <div class="item" style="border-left: 4px solid ${d.type === 'error' ? '#ef4444' : d.type === 'warning' ? '#f59e0b' : '#22c55e'}">
                            <div style="font-weight: 700; color: ${d.type === 'error' ? '#ef4444' : d.type === 'warning' ? '#f59e0b' : '#22c55e'}; margin-bottom: 8px;">
                                ${d.type === 'error' ? '❌' : d.type === 'warning' ? '⚠️' : '✅'} ${d.title}
                            </div>
                            <div style="margin-bottom: 8px; color: #cbd5e1;">${d.desc}</div>
                            <div style="color: #94a3b8; font-size: 13px;"><strong>Fix:</strong> ${d.fix}</div>
                        </div>
                    `).join('')}
                </div>
            `;

            // Final Status
            html += `
                <div class="section" style="background: ${canAccess ? '#064e3b' : '#7f1d1d'};">
                    <h2 style="color: ${canAccess ? '#22c55e' : '#ef4444'};">
                        ${canAccess ? '✅ READY TO ACCESS' : '❌ CANNOT ACCESS'}
                    </h2>
                    <div class="item">
                        ${canAccess 
                            ? '<strong style="color: #22c55e;">You should be able to access Live Rates → Compare Suppliers</strong>'
                            : '<strong style="color: #ef4444;">Please fix the issues above before accessing Live Rates</strong>'
                        }
                    </div>
                </div>
            `;

            results.innerHTML = html;
        }

        function clearAll() {
            if (confirm('⚠️ This will clear ALL data (cookies, localStorage) and you will need to login again. Continue?')) {
                localStorage.clear();
                sessionStorage.clear();
                // Clear all cookies
                document.cookie.split(";").forEach(c => {
                    document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
                });
                alert('✅ All data cleared! Redirecting to login...');
                setTimeout(() => {
                    window.location.href = '/franchise-login';
                }, 1000);
            }
        }

        // Auto-run on load
        window.addEventListener('load', runDiagnostic);
    </script>
</body>
</html>
